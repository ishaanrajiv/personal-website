  # About: `short` is the homepage's version, `paragraphs` the About page's.
  about:
    title: "About Me"
    short:
      - "I'm a Senior Principal Product Analyst at DB Digital, where I lead analytics for one of India's largest digital news platforms. Before this I worked with data at Hike, Roposo and Flipkart."
      - "Outside work I build software: an EPUB reader on the App Store, a web browser in beta, an open source terminal for coding agents, and small servers for the things I run myself."
    paragraphs:
      - "I'm a Senior Principal Product Analyst at DB Digital, where I lead analytics for one of India's largest digital news platforms. I've worked with data for over ten years, at Hike, Roposo and Flipkart before this, across social, e-commerce and news."
      - "That work has covered product analytics, fraud detection, recommendation systems, and getting data into the hands of the teams who need it."
      - "Outside work I build software. Lyrate, an EPUB reader, is on the App Store. Avia, a web browser for iPhone, is in public beta. Tern, a macOS terminal for coding agents, is open source, and so are Trail and Beacon, two small servers for observability and notifications. A couple more apps are in progress."


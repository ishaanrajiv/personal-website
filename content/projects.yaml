projects:
  featured:
    - name: "Lyrate - EPUB Reader"
      description: "An EPUB reader for iPhone and iPad. You pick the typeface, size, spacing, margins and alignment, and it justifies and hyphenates properly. Books sit on shelves you arrange, and you can search the text of your whole library. Everything stays on your device. There is no account, and reading, search and the dictionary all work offline. Built entirely with large language models, as an experiment in AI-assisted development."
      status: "beta"
      type: "iOS App"
      technologies: ["Swift", "SwiftUI", "SwiftData", "EPUBKit"]
      images:
        gallery:
          - "https://res.cloudinary.com/dqxww3j08/image/upload/v1793559929/02-library_qck8cc.png"
          - "https://res.cloudinary.com/dqxww3j08/image/upload/v1793559928/01-reader-highlight_irqyum.png"
          - "https://res.cloudinary.com/dqxww3j08/image/upload/v1793559929/04-dictionary_aqsvnd.png"
          - "https://res.cloudinary.com/dqxww3j08/image/upload/v1793559930/09-reader-dark_li9vjt.png"
          - "https://res.cloudinary.com/dqxww3j08/image/upload/v1793559929/08-stats_df91tu.png"
      links:
        github: ""
        testflight: "https://testflight.apple.com/join/VU4j4CwJ"
        website: "https://lyrate.ishaanrajiv.com"
      features:
        - "Custom Typography"
        - "Shelves"
        - "Full-Text Search"
        - "Offline Dictionary"
        - "Read Aloud"
        - "Quote Sharing"
        - "Reading Stats"
        - "ZIP Backups"
    - name: "Avia Browser"
      description: "A web browser for iPhone, built on WebKit. One floating bar sits at the bottom of the page and shrinks out of the way as you scroll, and tabs are a stack of cards you swipe through. Ads, trackers and cookie banners are blocked by default, tracking tags come off links, and any page can be read in reader mode or darkened. Articles you read stay on the phone, so you can find a page later by something it said or ask about it with Apple's on-device model."
      status: "beta"
      type: "iOS App"
      technologies: ["Swift", "SwiftUI", "WebKit", "SwiftData", "Foundation Models"]
      images:
        gallery:
          - "https://res.cloudinary.com/dqxww3j08/image/upload/v1793976100/avia-01-browse.png"
          - "https://res.cloudinary.com/dqxww3j08/image/upload/v1793976103/avia-02-scroll.png"
          - "https://res.cloudinary.com/dqxww3j08/image/upload/v1793976106/avia-03-tabs.png"
          - "https://res.cloudinary.com/dqxww3j08/image/upload/v1793976110/avia-04-tools.png"
          - "https://res.cloudinary.com/dqxww3j08/image/upload/v1793976112/avia-05-reader.png"
      links:
        github: ""
        testflight: "https://testflight.apple.com/join/N33Ybgu8"
      features:
        - "Floating Bar"
        - "Card Tabs"
        - "Ad and Tracker Blocking"
        - "Link Cleaning"
        - "Reader Mode"
        - "Dark Pages"
        - "Reading Memory"
        - "Private Tab Lock"
    - name: "Tern - Terminal for Coding Agents"
      description: "A macOS terminal built around coding agents. The sidebar groups tabs by folder and shows which agent is working, waiting for you, or done, and a background daemon keeps every session running after you quit the app. It runs on Ghostty's terminal engine and is in early alpha."
      status: "alpha"
      type: "macOS App"
      technologies: ["Swift", "AppKit", "Rust", "libghostty", "Metal"]
      images:
        aspect: "landscape"
        gallery:
          - "https://res.cloudinary.com/dqxww3j08/image/upload/v1793560132/Screenshot_2026-11-02_at_12.36.18_AM_e03gak.png"
          - "https://res.cloudinary.com/dqxww3j08/image/upload/v1793560131/Screenshot_2026-11-02_at_12.36.49_AM_mjxoe0.png"
          - "https://res.cloudinary.com/dqxww3j08/image/upload/v1793560131/Screenshot_2026-11-02_at_12.36.57_AM_xjgh3s.png"
          - "https://res.cloudinary.com/dqxww3j08/image/upload/v1793560131/Screenshot_2026-11-02_at_12.38.22_AM_cfwstn.png"
      links:
        github: "https://github.com/ishaanrajiv/tern"
      features:
        - "Agent Status Sidebar"
        - "Persistent Sessions"
        - "Worktree Tabs"
        - "Usage Limits"
        - "Splits and Search"
        - "SSH and tmux"
        - "Launch Presets"


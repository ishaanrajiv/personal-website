  wip:
    - name: "Hocin"
      summary: "A media client for Emby and Jellyfin that plays the original file on the device."
      description: "A media client for Emby and Jellyfin on Apple platforms: the Mac first, then Apple TV and iPhone. It plays the original file on the device instead of asking the server to transcode it, so HEVC, AV1, HDR10 and Dolby Vision video, Atmos and lossless audio, and image subtitles all arrive untouched. One app speaks to both servers through a single protocol, with the differences between them kept in one adapter."
      status: ""
      release: "wip"
      note: "Not released."
      type: "macOS and Apple TV App"
      technologies: ["Swift", "SwiftUI", "FFmpeg"]
      images:
        gallery: []
      links: {}
      features:
        - "Direct Play"
        - "HDR and Dolby Vision"
        - "Atmos and Lossless Audio"
        - "Emby and Jellyfin"
        - "Resume and Progress Sync"
    - name: "Paperside"
      summary: "An iPad comics reader that runs Paperback source extensions in its own JavaScript host."
      description: "An iPad reader for manga and comics that runs Paperback source extensions in its own JavaScriptCore host, with one context and one thread per extension. The engine is a Swift package with no UIKit in it, so it's tested on the Mac and driven from a command-line tool as well as from the app. On top of it sit a library, updates, history, and moving a title from one source to another."
      status: ""
      release: "wip"
      note: "Not released."
      type: "iPadOS App"
      technologies: ["Swift", "SwiftUI", "JavaScriptCore", "WebKit"]
      images:
        gallery: []
      links: {}
      features:
        - "Extension Host"
        - "Library and Updates"
        - "Reading History"
        - "Source Migration"
        - "Command-Line Runner"
  # Public repos worth reading.
  open_source:
    - name: "Trail"
      summary: "One small server that keeps a system's events, metrics, errors and logs."
      description: "One small server that keeps what a system does: its events, metrics, errors and logs. It's for a single machine or a small fleet, where a full observability stack is more to run than the thing being observed. It's one binary of about 8 MB. Recent data sits in SQLite and every finished day becomes one Parquet file, so anything that reads those can query it. A service declares what it sends in TOML, and Trail generates typed emitters from that for Python, TypeScript, JavaScript and Swift, so a misspelt event is a type error."
      status: ""
      release: "open_source"
      home: true
      type: "Observability Server"
      technologies: ["Rust", "SQLite", "Parquet"]
      images:
        gallery: []
      links:
        github: "https://github.com/ishaanrajiv/trail"
      features:
        - "Events, Metrics, Errors, Logs"
        - "SQLite and Parquet"
        - "Typed Emitters"
        - "Live Aggregations"
        - "Alert Rules"
    - name: "Beacon"
      summary: "A self-hosted notification server that decides which events deserve a push, and sends them to your own iPhone app."
      description: "A self-hosted notification server that decides which events deserve a push, and sends them to your own iPhone app through Apple's push service. It's for one person running their own services, where most events are worth recording and few are worth a sound. Every notification belongs to a declared kind whose class fixes where it shows and how it may push. A push is held while you're active and dropped if you saw it, and alerts have a lifecycle: pending, firing, resolved, with flap detection and silences."
      status: ""
      release: "open_source"
      home: true
      type: "Notification Server"
      technologies: ["Rust", "APNs"]
      images:
        gallery: []
      links:
        github: "https://github.com/ishaanrajiv/beacon"
      features:
        - "Declared Kinds"
        - "Presence-Aware Push"
        - "Alert Lifecycle"
        - "Silences"
        - "Typed Emitters"
